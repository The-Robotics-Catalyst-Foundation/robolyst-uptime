# Change these first
owner: The-Robotics-Catalyst-Foundation # Your GitHub organization or username, where this repository lives
repo: robolyst-uptime # The name of this repository

sites:
  - name: Robolyst
    url: https://robolyst.org

status-website:
  publish: true # private repo: build the real page instead of a 404 stub
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.robolyst.org
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Robolyst Status
  introTitle: "**Robolyst** service status"
  introMessage: Live uptime for Robolyst, checked every 5 minutes.
  navbar:
    - title: Status
      href: /

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
